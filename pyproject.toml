[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerorecon-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "opencv-python==5.0.0.93", "av==18.1.0", "pycolmap==4.2.0", "fastapi==0.141.1", "uvicorn==0.52.4", "python-multipart==0.0.32", "psutil>=7,<8"]

[project.scripts]
aerorecon = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
